[project]
name = "aurora"
version = "0.1.0"
description = "Aurora condominium concierge agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.2.0",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[project.scripts]
aurora-api = "aurora.cli:run_api"
aurora-restore = "aurora.cli:run_restore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
